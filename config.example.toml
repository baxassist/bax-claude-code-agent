# Настройки движка. Скопируйте в config.toml и поправьте под себя.
#
# Словарь: движок — эта программа вместе с Claude Code; агент — то, что вы завели и назвали
# в приложении Бакса; установка — запущенный движок на этом компьютере.
#
# Агентов в этом файле нет: их регистрируют отдельно, строкой из приложения —
#   bax-agent add "<id агента>:<id ключа>:<секрет>" --path ~/projects/api

[engine]
name = "MacBook"                        # как называть эту установку; по умолчанию hostname
server = "wss://relay.baxassist.com/agent"  # прод Бакса; только wss://, открытый ws:// — лишь в своей сети
log_level = "info"                      # debug, если нужно видеть каждый кадр
max_parallel = 2                        # одновременных задач на компьютер (общий предел)
task_timeout_min = 60                   # дольше — задача прерывается, агент освобождается
question_timeout_min = 10               # нет ответа на вопрос за это время — «запретить»
# claude_path = "/opt/homebrew/bin/claude"  # свой Claude Code; пусто — тот, что внутри SDK

# Рядом с этим файлом движок держит:
#   agents.json — что зарегистрировано: id агента, каталог, режим разрешений и ключ (права 600)
#   .install    — id этой установки: по нему сервер закрепляет ключ за одной машиной
#   agent.log   — журнал; его отдаёт команда «Лог движка» из приложения
#
# Режимы разрешений (--permission-mode у `bax-agent add`) — слова самого Claude Code:
#   manual           спрашивать разрешение на каждое действие (карточка в приложении)
#   acceptEdits      править файлы в проекте молча, про команды спрашивать
#   plan             только смотреть и предлагать план, ничего не менять
#   dontAsk          всё, что требует разрешения, запрещается сразу
#   auto             решает встроенный классификатор — вопросы в приложение НЕ приходят
#   bypassPermissions разрешать всё подряд; только если понимаете, чем рискуете
